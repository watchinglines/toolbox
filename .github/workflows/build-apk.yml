name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: 移除 OpenCV CMake 配置(避免 v1 embedding 错误)
        run: |
          rm -rf android/app/src/main/cpp || true
          cat > android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }
          
          android {
              namespace = "com.toolbox.scanner"
              compileSdk = 34
              ndkVersion = flutter.ndkVersion
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          
              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_17.toString()
              }
          
              defaultConfig {
                  applicationId = "com.toolbox.scanner"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
                  multiDexEnabled = true
                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a", "x86_64")
                  }
              }
          
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }
          
          dependencies {
              implementation("androidx.multidex:multidex:2.0.1")
          }
          EOF
          echo "✅ 已清理 OpenCV 配置"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Debug)
        run: flutter build apk --debug

      - name: 复制到 dist 目录
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/toolbox-0.1.0-debug.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-debug-apk
          path: dist/toolbox-0.1.0-debug.apk
          retention-days: 90

      - name: 上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/
            .gradle/
          retention-days: 7
