name: Build Android APK (使用系统 SDK)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 检查系统 SDK
        run: |
          echo "=== Android SDK 路径 ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls -la $ANDROID_HOME/ 2>/dev/null | head -20
          echo "---"
          echo "=== 已安装的 platforms ==="
          ls $ANDROID_HOME/platforms/ 2>/dev/null
          echo "---"
          echo "=== 已安装的 build-tools ==="
          ls $ANDROID_HOME/build-tools/ 2>/dev/null
          echo "---"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "✅ 检查完成"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: 🔧 修复 Dart 编译错误
        run: |
          if ! grep -q "import '../../data/pdf_exporter.dart'" lib/features/scanner/presentation/bloc/scanner_bloc.dart; then
            sed -i "/import '..\/..\/..\/..\/app\/di.dart';/a import '../../data/pdf_exporter.dart';" lib/features/scanner/presentation/bloc/scanner_bloc.dart
          fi
          sed -i 's/const ui\.Offset(0, outH\.toDouble())/ui.Offset(0, outH.toDouble())/g' lib/features/scanner/data/image_processor.dart
          sed -i 's/const ui\.Offset(0, task\.outH\.toDouble())/ui.Offset(0, task.outH.toDouble())/g' lib/features/scanner/data/cv/perspective_warper.dart
          sed -i "s/throw const CameraException/throw CameraException/g" lib/features/scanner/data/scanner_repository.dart
          sed -i '/final normSrc = _normalize(src);/d' lib/features/scanner/data/cv/homography.dart
          sed -i '/final normDst = _normalize(dst);/d' lib/features/scanner/data/cv/homography.dart
          sed -i '/\/\/ 1\. 数据归一化/a\    final _NormData normSrcData = _normalize(src);\n    final _NormData normDstData = _normalize(dst);\n    final normSrc = normSrcData.normalized;\n    final normDst = normDstData.normalized;' lib/features/scanner/data/cv/homography.dart
          sed -i 's/normSrc\.norm, normDst\.norm/normSrcData.norm, normDstData.norm/g' lib/features/scanner/data/cv/homography.dart
          echo "✅ Dart 错误已修复"

      - name: 配置 Flutter
        run: |
          flutter config --no-analytics
          git config --global --add safe.directory '*'
          flutter config --android-sdk $ANDROID_HOME
          echo "✅ Flutter Android SDK: $ANDROID_HOME"

      - name: 配置 local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: 探测最高 SDK 并匹配 compileSdk
        run: |
          MAX_SDK=$(ls $ANDROID_HOME/platforms/ 2>/dev/null | grep -oE 'android-[0-9]+' | sort -V | tail -1 | sed 's/android-//')
          MAX_SDK=${MAX_SDK:-34}
          echo "✅ 系统最高 SDK: $MAX_SDK"
          find android -name "build.gradle*" -type f -exec sed -i \
            -e "s/compileSdk = flutter.compileSdkVersion/compileSdk = $MAX_SDK/g" \
            -e "s/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion $MAX_SDK/g" \
            -e "s/targetSdk = flutter.targetSdkVersion/targetSdk = $MAX_SDK/g" \
            -e "s/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion $MAX_SDK/g" {} \;
          echo "✅ compileSdk/targetSdk → $MAX_SDK"

      - name: Install dependencies
        run: flutter pub get

      - name: 配置 AndroidX + Manifest + MainActivity
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          android.defaults.buildfeatures.buildconfig=true
          kotlin.code.style=official
          EOF

          mkdir -p android/app/src/main/kotlin/com/toolbox/scanner
          cat > android/app/src/main/kotlin/com/toolbox/scanner/MainActivity.kt << 'KT_EOF'
          package com.toolbox.scanner
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.toolbox/native"
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "getPlatformVersion" -> result.success("Android ${android.os.Build.VERSION.RELEASE}")
                              "scanDocument" -> result.success(null)
                              "startAR" -> result.success(null)
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          KT_EOF

          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-feature android:name="android.hardware.camera" android:required="true"/>
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false"/>
              <application android:label="ToolBox" android:name="${applicationName}" android:icon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          MANIFEST_EOF
          echo "✅ 配置完成"

      - name: Build Debug APK
        run: flutter build apk --debug 2>&1 | tail -50

      - name: 查找并复制 APK
        run: |
          find build -name "*.apk" -type f 2>/dev/null
          mkdir -p dist
          APK_PATH=""
          for path in \
            "build/app/outputs/flutter-apk/app-debug.apk" \
            "build/app/outputs/apk/debug/app-debug.apk" \
            "build/app/outputs/apk/app-debug.apk"; do
            if [ -f "$path" ]; then
              APK_PATH="$path"
              break
            fi
          done
          if [ -z "$APK_PATH" ]; then
            find build -type d 2>/dev/null | head -20
            exit 1
          fi
          cp "$APK_PATH" dist/toolbox-0.1.0-debug.apk
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-debug-apk
          path: dist/toolbox-0.1.0-debug.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/**/*.log
            ~/.gradle/daemon/**/*.out.log
          retention-days: 7
          if-no-files-found: ignore
