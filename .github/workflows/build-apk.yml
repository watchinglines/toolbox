name: Build Android APK (auto-fix paths + detect gradle)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =============== AUTO-FIX FILE PATHS ===============
      - name: Auto-fix misplaced files
        run: |
          echo "=== BEFORE: root files ==="
          ls -la
          echo ""

          # Move android-app-build.gradle -> android/app/build.gradle (Groovy)
          if [ -f "android-app-build.gradle" ]; then
            mkdir -p android/app
            mv -v "android-app-build.gradle" "android/app/build.gradle"
          fi

          # Move android-app-build.gradle.kts -> android/app/build.gradle.kts (Kotlin DSL)
          if [ -f "android-app-build.gradle.kts" ]; then
            mkdir -p android/app
            mv -v "android-app-build.gradle.kts" "android/app/build.gradle.kts"
          fi

          # Move android-app-src-main-AndroidManifest.xml -> android/app/src/main/AndroidManifest.xml
          if [ -f "android-app-src-main-AndroidManifest.xml" ]; then
            mkdir -p android/app/src/main
            mv -v "android-app-src-main-AndroidManifest.xml" "android/app/src/main/AndroidManifest.xml"
          fi

          # Move android-gradle.properties -> android/gradle.properties
          if [ -f "android-gradle.properties" ]; then
            mkdir -p android
            mv -v "android-gradle.properties" "android/gradle.properties"
          fi

          # Move MainActivity.kt -> android/app/src/main/kotlin/com/toolbox/scanner/MainActivity.kt
          if [ -f "MainActivity.kt" ]; then
            mkdir -p android/app/src/main/kotlin/com/toolbox/scanner
            mv -v "MainActivity.kt" "android/app/src/main/kotlin/com/toolbox/scanner/MainActivity.kt"
          fi

          echo ""
          echo "=== AFTER: project tree ==="
          ls -la
          echo "--- android dir ---"
          find android -type f 2>/dev/null
      # ==================================================

      - name: Verify v2 embedding config
        run: |
          echo "=== MainActivity ==="
          find android -name "MainActivity.*" -exec echo "--- {} ---" \; -exec cat {} \;
          echo ""
          echo "=== AndroidManifest flutterEmbedding ==="
          grep -A1 flutterEmbedding android/app/src/main/AndroidManifest.xml || echo "MISSING"
          echo ""

          echo "=== App build.gradle (detect) ==="
          if [ -f "android/app/build.gradle" ]; then
            echo "Found: android/app/build.gradle (Groovy)"
            head -80 android/app/build.gradle
          elif [ -f "android/app/build.gradle.kts" ]; then
            echo "Found: android/app/build.gradle.kts (Kotlin DSL)"
            head -80 android/app/build.gradle.kts
          else
            echo "ERROR: No build.gradle or build.gradle.kts found"
            find android -name "build.gradle*" 2>/dev/null
            exit 1
          fi
          echo ""

          echo "=== gradle.properties ==="
          cat android/gradle.properties
          echo ""

          echo "=== Project-level build.gradle (if any) ==="
          if [ -f "android/build.gradle" ]; then
            echo "--- android/build.gradle ---"
            cat android/build.gradle
          fi
          if [ -f "android/build.gradle.kts" ]; then
            echo "--- android/build.gradle.kts ---"
            cat android/build.gradle.kts
          fi
          echo ""

          echo "=== settings.gradle (if any) ==="
          if [ -f "android/settings.gradle" ]; then
            echo "--- android/settings.gradle ---"
            cat android/settings.gradle
          fi
          if [ -f "android/settings.gradle.kts" ]; then
            echo "--- android/settings.gradle.kts ---"
            cat android/settings.gradle.kts
          fi
          echo ""

          echo "=== local.properties (ANDROID SDK location) ==="
          cat android/local.properties 2>/dev/null || echo "no local.properties"
          echo ""

          echo "=== app/src/main/ tree ==="
          find android/app/src/main -type f 2>/dev/null

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          flutter build apk --release -v 2>&1 | tee /tmp/flutter_build.log
        continue-on-error: true

      - name: Locate APK
        id: locate
        run: |
          find build -name "*.apk" -type f 2>/dev/null
          APK=$(find build -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "APK_PATH=$APK" >> $GITHUB_ENV
          else
            echo "NO_APK=true" >> $GITHUB_ENV
          fi
        continue-on-error: true

      - name: Upload APK
        if: env.APK_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.APK_PATH }}
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: /tmp/flutter_build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Print build log tail
        if: always()
        run: |
          echo "==================== BUILD LOG TAIL (200 lines) ===================="
          tail -200 /tmp/flutter_build.log 2>/dev/null || echo "No build log"
          echo "==================== END ===================="
