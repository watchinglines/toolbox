name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify v2 embedding config
        run: |
          echo "=== MainActivity ==="
          find android -name "MainActivity.*" -exec echo "--- {} ---" \; -exec cat {} \;
          echo "=== AndroidManifest flutterEmbedding ==="
          grep -A1 flutterEmbedding android/app/src/main/AndroidManifest.xml || echo "MISSING"
          echo "=== app build.gradle (first 50 lines) ==="
          head -50 android/app/build.gradle
          echo "=== gradle.properties ==="
          cat android/gradle.properties

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          flutter build apk --release -v 2>&1 | tee /tmp/flutter_build.log
        continue-on-error: true

      - name: Locate APK
        id: locate
        run: |
          find build -name "*.apk" -type f 2>/dev/null
          APK=$(find build -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "APK_PATH=$APK" >> $GITHUB_ENV
          else
            echo "NO_APK=true" >> $GITHUB_ENV
          fi
        continue-on-error: true

      - name: Upload APK
        if: env.APK_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.APK_PATH }}
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: /tmp/flutter_build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Print build log tail
        if: always()
        run: |
          echo "==================== BUILD LOG TAIL (200 lines) ===================="
          tail -200 /tmp/flutter_build.log 2>/dev/null || echo "No build log"
          echo "==================== END ===================="
