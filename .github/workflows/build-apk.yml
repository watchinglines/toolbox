name: Build Android APK (v2 embedding 终极修复版)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: 🔥 终极修复 - 重建 android 目录
        run: |
          echo "🗑️  删除整个 android 目录..."
          rm -rf android
          echo "🏗️  重新生成 android 目录..."
          flutter create --org com.toolbox --project-name scanner --platforms=android --no-pub . 2>&1 | tail -20
          echo "✅ 重建完成"
          ls -la android/

      - name: Configure Flutter
        run: |
          flutter config --no-analytics
          git config --global --add safe.directory '*'

      - name: Install dependencies
        run: flutter pub get

      - name: 配置签名 + AndroidX
        run: |
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass toolbox2026 -keypass toolbox2026 -dname "CN=ToolBox" 2>&1 | tail -3
          cat > android/key.properties << 'EOF'
          storePassword=toolbox2026
          keyPassword=toolbox2026
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          android.defaults.buildfeatures.buildconfig=true
          kotlin.code.style=official
          EOF
          echo "✅ 配置完成"

      - name: 覆盖 MainActivity + Manifest
        run: |
          mkdir -p android/app/src/main/kotlin/com/toolbox/scanner
          cat > android/app/src/main/kotlin/com/toolbox/scanner/MainActivity.kt << 'KT_EOF'
          package com.toolbox.scanner
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.toolbox/native"
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "getPlatformVersion" -> result.success("Android ${android.os.Build.VERSION.RELEASE}")
                              "scanDocument" -> result.success(null)
                              "startAR" -> result.success(null)
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          KT_EOF
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-feature android:name="android.hardware.camera" android:required="true"/>
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false"/>
              <application android:label="ToolBox" android:name="${applicationName}" android:icon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          MANIFEST_EOF
          echo "✅ 覆盖完成"

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: 复制到 dist
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/toolbox-0.1.0-debug.apk
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-debug-apk
          description: ToolBox Debug APK
          path: dist/toolbox-0.1.0-debug.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/**/*.log
            ~/.gradle/daemon/**/*.out.log
          retention-days: 7
          if-no-files-found: ignore
