name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      
      - name: ALL IN ONE
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          {
            echo "=== STEP A: ROOT FILES ==="
            ls -la
            echo ""
            echo "=== STEP A: ALL FILES ==="
            find . -type f -not -path "./.git/*" | sort
            echo ""
            echo "=== STEP A: ANDROID TREE ==="
            find android -type f 2>/dev/null | sort
            echo ""
            echo "=== STEP B: CLEANUP ==="
            rm -fv MainActivity.kt 2>/dev/null || true
            rm -fv android-app-build.gradle* 2>/dev/null || true
            rm -fv android-app-src-main-AndroidManifest.xml 2>/dev/null || true
            rm -fv android-gradle.properties 2>/dev/null || true
            rm -fv android/app/android-app-build.gradle* 2>/dev/null || true
            rm -fv android/app/src/main/android-app-src-main-AndroidManifest.xml 2>/dev/null || true
            rm -fv android/android-gradle.properties 2>/dev/null || true
            echo ""
            echo "=== STEP C: ACTIVE FILES ==="
            echo "--- gradle.properties ---"
            cat android/gradle.properties
            echo ""
            echo "--- build.gradle.kts ---"
            cat android/app/build.gradle.kts
            echo ""
            echo "--- MainActivity ---"
            find android -name "MainActivity.*" -exec cat {} \;
            echo ""
            echo "--- manifest flutterEmbedding ---"
            grep -A1 flutterEmbedding android/app/src/main/AndroidManifest.xml
            echo ""
            echo "=== STEP D: BUILD ==="
            flutter --disable-analytics
            flutter pub get
            echo "--- pub get done ---"
            flutter build apk --release -v
            echo "--- build done ---"
            echo ""
            echo "=== STEP E: APK ==="
            find build -name "*.apk" 2>/dev/null
          } > /tmp/full.log 2>&1
          echo "Log written. Size: $(wc -c < /tmp/full.log) bytes"
          exit 0
      
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-log
          path: /tmp/full.log
          if-no-files-found: ignore
