name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      
      - name: Show project state
        run: |
          echo "=== ROOT ==="
          ls -la
          echo ""
          echo "=== ANDROID TREE ==="
          find android -type f 2>/dev/null
          echo ""
          echo "=== ACTIVE gradle.properties ==="
          cat android/gradle.properties
          echo ""
          echo "=== ACTIVE build.gradle.kts ==="
          cat android/app/build.gradle.kts
          echo ""
          echo "=== ACTIVE MainActivity ==="
          find android -name "MainActivity.*" -exec cat {} \;
          echo ""
          echo "=== ACTIVE manifest embedding ==="
          grep -A1 flutterEmbedding android/app/src/main/AndroidManifest.xml
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      
      - name: Cleanup misplaced files
        run: |
          rm -fv MainActivity.kt 2>/dev/null || true
          rm -fv android-app-build.gradle* 2>/dev/null || true
          rm -fv android-app-src-main-AndroidManifest.xml 2>/dev/null || true
          rm -fv android-gradle.properties 2>/dev/null || true
          rm -fv android/app/android-app-build.gradle* 2>/dev/null || true
          rm -fv android/app/src/main/android-app-src-main-AndroidManifest.xml 2>/dev/null || true
          rm -fv android/android-gradle.properties 2>/dev/null || true
          echo ""
          echo "=== After cleanup ==="
          find . -name "android-app*" -o -name "android-gradle*" 2>/dev/null
      
      - name: Build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          flutter --disable-analytics
          flutter pub get
          flutter build apk --release -v 2>&1 | tee /tmp/build.log
          find build -name "*.apk" 2>/dev/null
        # NO continue-on-error: this step MUST fail if build fails
      
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
